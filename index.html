    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              art: ['Syncopate', 'sans-serif'],
            },
            colors: {
              accent: '#6366f1',
              void: '#030303',
            },
            animation: {
              'blob': 'blob 10s infinite',
              'float': 'float 8s ease-in-out infinite',
              'spin-slow': 'spin 20s linear infinite',
              'pulse-glow': 'pulse-glow 4s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1) rotate(0deg)' },
                '33%': { transform: 'translate(50px, -50px) scale(1.2) rotate(120deg)' },
                '66%': { transform: 'translate(-40px, 40px) scale(0.8) rotate(240deg)' },
                '100%': { transform: 'translate(0px, 0px) scale(1) rotate(360deg)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              'pulse-glow': {
                '0%, 100%': { opacity: 0.5 },
                '50%': { opacity: 0.8 },
              }
            }
          },
        },
      }
    </script>

      }

      .glass-panel {
        background: rgba(20, 20, 20, 0.6);
        /* Optimization: Reduced blur radius in backdrop filter */
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .text-stroke {
        -webkit-text-stroke: 1px rgba(255,255,255,0.2);
        color: transparent;
      }
      
      .text-stroke-hover:hover {
        -webkit-text-stroke: 0px;
        color: white;
      }

      /* Selection */
      ::selection {
        background: #fff;
        color: #000;
      }
